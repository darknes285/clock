<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>우리 아이 시계 배우기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    touch-action: pan-y;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    transition: background 1.5s ease;
    z-index: 0;
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  #celestial {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 2;
  }

  .sun, .moon {
    position: absolute;
    border-radius: 50%;
    transition: filter 1.5s ease;
  }

  .sun {
    width: 110px; height: 110px;
    background: radial-gradient(circle at 35% 35%, #fff4a3, #ffcf33 55%, #ff9a1c 100%);
    box-shadow:
      0 0 60px 20px rgba(255, 207, 51, 0.55),
      0 0 120px 40px rgba(255, 154, 28, 0.35);
  }

  .moon {
    width: 95px; height: 95px;
    background: radial-gradient(circle at 35% 35%, #ffffff, #e5e9ff 55%, #b7bfd9 100%);
    box-shadow: 0 0 40px 10px rgba(230, 236, 255, 0.5);
  }
  .moon::before, .moon::after {
    content: "";
    position: absolute;
    background: rgba(170, 175, 195, 0.35);
    border-radius: 50%;
  }
  .moon::before { width: 18px; height: 18px; top: 25px; left: 22px; }
  .moon::after  { width: 12px; height: 12px; top: 55px; left: 55px; }

  #clouds {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    filter: blur(2px);
  }

  #main {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px;
  }

  #period-label {
    font-size: clamp(22px, 3.5vw, 36px);
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.18);
    padding: 6px 22px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  #clock-wrap {
    position: relative;
    width: min(70vmin, 520px);
    aspect-ratio: 1 / 1;
  }

  #clock-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.25));
  }

  .clock-face { fill: #fffdf6; stroke: #2a2a2a; stroke-width: 4; }
  .clock-rim { fill: none; stroke: #c9a24b; stroke-width: 10; }
  .clock-inner-rim { fill: none; stroke: #8a6d2a; stroke-width: 2; }

  .tick-hour { stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; }
  .tick-minute { stroke: #555; stroke-width: 1.5; stroke-linecap: round; }

  #hour-colors { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  #hour-colors.on { opacity: 1; }
  .hour-color-line { stroke-width: 3; stroke-linecap: round; }

  #hour-sectors { pointer-events: none; }
  .hour-sector { stroke: none; opacity: 0; transition: opacity 0.3s ease; }
  #hour-sectors.on .hour-sector { opacity: 0.55; }

  .number {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .number {
    fill: #1a1a1a;
    font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .hour-hand {
    stroke: #1a1a1a;
    stroke-width: 10;
    stroke-linecap: round;
    pointer-events: none;
  }
  .minute-hand {
    stroke: #2a4ea8;
    stroke-width: 7;
    stroke-linecap: round;
    cursor: grab;
    touch-action: none;
  }
  .minute-hand:active { cursor: grabbing; }

  .minute-hit {
    stroke: transparent;
    stroke-width: 36;
    stroke-linecap: round;
    cursor: grab;
    touch-action: none;
  }
  .minute-hit:active { cursor: grabbing; }

  .center-dot { fill: #c9a24b; stroke: #1a1a1a; stroke-width: 2; }
  .center-dot-inner { fill: #1a1a1a; }

  #digital {
    display: flex;
    align-items: baseline;
    gap: 14px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    padding: 12px 28px;
    border-radius: 18px;
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  #ampm {
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffd86b;
  }

  /* English mode: show time first, then lowercase am/pm attached (no gap) */
  html[lang="en"] #digital { gap: 0; }
  html[lang="en"] #time { order: 1; }
  html[lang="en"] #ampm {
    order: 2;
    font-size: clamp(18px, 2.4vw, 26px);
    letter-spacing: 0;
    margin-left: 0;
  }


  #time {
    font-family: "Consolas", "Menlo", "맑은 고딕", monospace;
    font-size: clamp(42px, 6.5vw, 72px);
    font-weight: 800;
    letter-spacing: 3px;
  }

  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 11;
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.25);
    padding: 6px 14px;
    border-radius: 999px;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    transition: transform 0.9s ease, opacity 0.9s ease;
  }
  #hint.hidden {
    transform: translate(-50%, 160%);
    opacity: 0;
  }

  #controls {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 12;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #menu-items {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: rgba(255,255,255,0.9);
    border: 2px solid #c9a24b;
    color: #333;
    font-weight: 700;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  .btn:hover { background: #fff; }
  .btn.active { background: #ffd86b; border-color: #8a6d2a; }

  #btn-menu {
    display: none;
    font-size: 20px;
    padding: 6px 12px;
    line-height: 1;
  }

  /* Lesson mode: blink/highlight animations */
  @keyframes hl-hand-blink {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); opacity: 1; }
    50% { filter: drop-shadow(0 0 14px #ffeb3b) drop-shadow(0 0 22px #fff176); opacity: 0.45; }
  }
  .hl-hand { animation: hl-hand-blink 0.55s ease-in-out infinite; }

  @keyframes hl-sector-blink {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.95; }
  }
  .hour-sector.hl-sector { animation: hl-sector-blink 0.55s ease-in-out infinite; }

  @keyframes hl-number-blink {
    0%, 100% { fill: #1a1a1a; }
    50% { fill: #ff3d00; }
  }
  .hl-number { animation: hl-number-blink 0.55s ease-in-out infinite; }

  @keyframes hl-tick-blink {
    0%, 100% { stroke: #555; stroke-width: 1.5; }
    50% { stroke: #ff3d00; stroke-width: 4; }
  }
  .tick-minute.hl-tick { animation: hl-tick-blink 0.55s ease-in-out infinite; }
  @keyframes hl-tick-hour-blink {
    0%, 100% { stroke: #1a1a1a; stroke-width: 4; }
    50% { stroke: #ff3d00; stroke-width: 6; }
  }
  .tick-hour.hl-tick { animation: hl-tick-hour-blink 0.55s ease-in-out infinite; }

  @keyframes clock-flash-anim {
    0%, 100% { filter: drop-shadow(0 10px 30px rgba(0,0,0,0.25)) brightness(1); }
    50% { filter: drop-shadow(0 0 40px rgba(255,255,180,0.9)) brightness(1.5); }
  }
  #clock-svg.flashing { animation: clock-flash-anim 0.55s ease-in-out 3; }

  /* Learn button + menu (bottom-right) */
  #learn-controls {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 15;
    display: flex;
    flex-direction: column-reverse;
    align-items: flex-end;
    gap: 8px;
  }
  #btn-learn {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: #fff;
    border: 2px solid #fff;
    font-weight: 800;
    font-size: 16px;
    padding: 12px 20px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    white-space: nowrap;
  }
  #btn-learn:hover { filter: brightness(1.1); }
  #learn-menu {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 0;
    overflow: hidden;
    opacity: 0;
    transition: max-height 0.3s ease, opacity 0.25s ease;
    pointer-events: none;
  }
  #learn-controls.open #learn-menu {
    max-height: 500px;
    opacity: 1;
    pointer-events: auto;
  }
  .learn-item {
    background: rgba(255,255,255,0.95);
    border: 2px solid #c44569;
    color: #333;
    font-weight: 700;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    white-space: nowrap;
    text-align: left;
  }
  .learn-item:hover { background: #ffe0ec; }

  /* Lesson player (active during lesson) */
  #lesson-player {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 16;
    background: rgba(0,0,0,0.78);
    color: #fff;
    padding: 14px 18px;
    border-radius: 16px;
    width: min(620px, 92vw);
    display: none;
    flex-direction: column;
    gap: 10px;
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
  #lesson-player.active { display: flex; }
  #lesson-title {
    font-size: 13px;
    opacity: 0.75;
    text-align: center;
  }
  #lesson-text {
    font-size: clamp(15px, 2.3vw, 20px);
    text-align: center;
    line-height: 1.45;
    min-height: 2.6em;
    font-weight: 600;
  }
  #lesson-controls {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .lesson-btn {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    font-weight: 700;
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .lesson-btn:hover { background: rgba(255,255,255,0.3); }
  .lesson-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 1235px) {
    #controls {
      flex-direction: column;
      align-items: flex-end;
    }
    #btn-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      order: 1;
    }
    #menu-items {
      order: 2;
      flex-direction: column;
      align-items: stretch;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      pointer-events: none;
    }
    #controls.open #menu-items {
      max-height: 80vh;
      opacity: 1;
      pointer-events: auto;
    }
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="clouds"></div>
  <div id="celestial">
    <div class="sun" id="sun"></div>
    <div class="moon" id="moon"></div>
  </div>

  <div id="controls">
    <div id="menu-items">
      <button class="btn" id="btn-lang">English</button>
      <button class="btn" id="btn-colors">색상</button>
      <button class="btn" id="btn-now">지금 시간</button>
      <button class="btn" id="btn-play">자동 재생 ▶</button>
    </div>
    <button class="btn" id="btn-menu" aria-label="Menu">☰</button>
  </div>

  <div id="main">
    <div id="period-label">아침</div>

    <div id="clock-wrap">
      <svg id="clock-svg" viewBox="-200 -200 400 400">
        <circle class="clock-rim" cx="0" cy="0" r="192"/>
        <circle class="clock-face" cx="0" cy="0" r="185"/>
        <g id="hour-sectors"></g>
        <circle class="clock-inner-rim" cx="0" cy="0" r="170"/>
        <g id="ticks"></g>
        <g id="hour-colors"></g>
        <g id="numbers"></g>

        <line class="hour-hand" id="hour-hand" x1="0" y1="0" x2="0" y2="-90"/>
        <line class="minute-hand" id="minute-hand" x1="0" y1="0" x2="0" y2="-135"/>
        <line class="minute-hit" id="minute-hit" x1="0" y1="0" x2="0" y2="-150"/>

        <circle class="center-dot" cx="0" cy="0" r="12"/>
        <circle class="center-dot-inner" cx="0" cy="0" r="4"/>
      </svg>
    </div>

    <div id="digital">
      <span id="ampm">오전</span>
      <span id="time">10:10</span>
    </div>
  </div>

  <div id="hint">긴 바늘(파란 바늘)을 잡고 돌려 보세요</div>

  <div id="learn-controls">
    <div id="learn-menu">
      <button class="learn-item" data-lesson="basics">1. 기본 개념 소개</button>
      <button class="learn-item" data-lesson="hours">2. 시 배우기</button>
      <button class="learn-item" data-lesson="minutes">3. 분 배우기</button>
      <button class="learn-item" data-lesson="combined">4. 실전 시계 읽기</button>
      <button class="learn-item" data-lesson="ampm">5. 오전과 오후</button>
      <button class="learn-item" data-lesson="tricky">6. 이럴 땐 몇 시?</button>
    </div>
    <button id="btn-learn">📚 학습</button>
  </div>

  <div id="lesson-player">
    <div id="lesson-title"></div>
    <div id="lesson-text"></div>
    <div id="lesson-controls">
      <button class="lesson-btn" id="lesson-prev">◀</button>
      <button class="lesson-btn" id="lesson-pause">⏸</button>
      <button class="lesson-btn" id="lesson-next">▶</button>
      <button class="lesson-btn" id="lesson-close">✕</button>
    </div>
  </div>

<script>
(function() {
  "use strict";

  // Total minutes since midnight: 0 .. 1440 (exclusive)
  const _now = new Date();
  let totalMinutes = _now.getHours() * 60 + _now.getMinutes(); // start at current time
  let dragging = false;
  let autoPlay = false;
  let autoPlayStart = 0;
  let autoPlayStartMinutes = 0;
  let lang = "ko"; // "ko" or "en" — default Korean
  let colorsOn = false;
  let menuOpen = false;

  // Colors for each hour 1..12 (index 0 = 12 o'clock / top)
  const HOUR_COLORS = [
    "#e53935", // 12 - red
    "#fb8c00", // 1  - orange
    "#fdd835", // 2  - yellow
    "#7cb342", // 3  - light green
    "#2e7d32", // 4  - green
    "#26c6da", // 5  - cyan
    "#1e88e5", // 6  - blue
    "#1a237e", // 7  - navy
    "#6a1b9a", // 8  - purple
    "#c2185b", // 9  - magenta/red
    "#424242", // 10 - dark gray/black
    "#00838f"  // 11 - teal
  ];

  const I18N = {
    ko: {
      title: "우리 아이 시계 배우기",
      btnLangOther: "English",
      btnColorsOn: "색상 끄기",
      btnColorsOff: "색상",
      btnNow: "지금 시간",
      btnPlay: "자동 재생 ▶",
      btnStop: "자동 재생 ■",
      am: "오전",
      pm: "오후",
      hint: "긴 바늘(파란 바늘)을 잡고 돌려 보세요",
      periods: [
        "깊은 밤",
        "새벽 (해가 떠오르는 중)",
        "아침 해돋이",
        "아침",
        "한낮 (해가 중천에)",
        "오후",
        "늦은 오후",
        "저녁 노을 (해가 지는 중)",
        "저녁",
        "밤 (달이 떠오름)",
        "정오 (해가 가장 높은 때)",
        "자정 (하루가 바뀌는 때)"
      ]
    },
    en: {
      title: "Kids Clock Learning",
      btnLangOther: "한국어",
      btnColorsOn: "Colors Off",
      btnColorsOff: "Colors",
      btnNow: "Now",
      btnPlay: "Auto Play ▶",
      btnStop: "Auto Play ■",
      am: "a.m.",
      pm: "p.m.",
      hint: "Grab the long (blue) hand and drag it",
      periods: [
        "Deep Night",
        "Dawn (sun rising)",
        "Morning Sunrise",
        "Morning",
        "Midday (sun at zenith)",
        "Afternoon",
        "Late Afternoon",
        "Sunset (sun setting)",
        "Evening",
        "Night (moon rising)",
        "Noon (sun is highest)",
        "Midnight (a new day begins)"
      ]
    }
  };

  const skyEl = document.getElementById("sky");
  const starsEl = document.getElementById("stars");
  const cloudsEl = document.getElementById("clouds");
  const sunEl = document.getElementById("sun");
  const moonEl = document.getElementById("moon");
  const hourHand = document.getElementById("hour-hand");
  const minuteHand = document.getElementById("minute-hand");
  const minuteHit = document.getElementById("minute-hit");
  const minuteHitFallback = minuteHand; // backup
  const ampmEl = document.getElementById("ampm");
  const timeEl = document.getElementById("time");
  const periodEl = document.getElementById("period-label");
  const clockSvg = document.getElementById("clock-svg");
  const ticksG = document.getElementById("ticks");
  const numbersG = document.getElementById("numbers");
  const hourColorsG = document.getElementById("hour-colors");
  const hourSectorsG = document.getElementById("hour-sectors");
  const hintEl = document.getElementById("hint");
  const btnLang = document.getElementById("btn-lang");
  const btnColors = document.getElementById("btn-colors");
  const btnNow = document.getElementById("btn-now");
  const btnMenu = document.getElementById("btn-menu");
  const controlsEl = document.getElementById("controls");

  // Build ticks
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180;
    const outer = 180;
    const inner = i % 5 === 0 ? 158 : 168;
    const x1 = Math.sin(angle) * inner;
    const y1 = -Math.cos(angle) * inner;
    const x2 = Math.sin(angle) * outer;
    const y2 = -Math.cos(angle) * outer;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", i % 5 === 0 ? "tick-hour" : "tick-minute");
    line.setAttribute("id", "tick-" + i);
    ticksG.appendChild(line);
  }

  // Build hour numbers
  for (let h = 1; h <= 12; h++) {
    const angle = (h * 30) * Math.PI / 180;
    const r = 135;
    const x = Math.sin(angle) * r;
    const y = -Math.cos(angle) * r;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.setAttribute("class", "number");
    t.setAttribute("id", "num-" + h);
    t.setAttribute("font-size", "34");
    t.textContent = String(h);
    numbersG.appendChild(t);
  }

  // Build hour color lines (hidden until toggled on). From center to each hour mark.
  for (let h = 0; h < 12; h++) {
    const angle = (h * 30) * Math.PI / 180;
    const r = 155;
    const x2 = Math.sin(angle) * r;
    const y2 = -Math.cos(angle) * r;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", 0);
    line.setAttribute("y1", 0);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", "hour-color-line");
    line.setAttribute("stroke", HOUR_COLORS[h]);
    hourColorsG.appendChild(line);
  }

  // Build hour sectors (pie wedges between adjacent hour marks). Each is filled
  // with the color of the hour the sector STARTS at (sector h-> h+1 uses HOUR_COLORS[h]).
  for (let h = 0; h < 12; h++) {
    const startDeg = h * 30;
    const endDeg = (h + 1) * 30;
    const startA = startDeg * Math.PI / 180;
    const endA = endDeg * Math.PI / 180;
    const r = 170; // fill up to the inner rim
    const x1 = Math.sin(startA) * r;
    const y1 = -Math.cos(startA) * r;
    const x2 = Math.sin(endA) * r;
    const y2 = -Math.cos(endA) * r;
    const d = "M 0 0 L " + x1 + " " + y1 + " A " + r + " " + r + " 0 0 1 " + x2 + " " + y2 + " Z";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "hour-sector");

  // Normalize minutes to [0, 1440)
  function normalize(m) {

  // Update display based on totalMinutes
  function update() {
    const m = normalize(totalMinutes);
    const h24 = Math.floor(m / 60);
    const mm = Math.floor(m % 60);

    // Hands
    const minuteAngle = (m % 60) * 6; // 0-360 over 60 minutes
    const hourAngle = ((m % 720) / 720) * 360; // 0-360 over 12 hours (smooth)
    hourHand.setAttribute("transform", "rotate(" + hourAngle + ")");
    minuteHand.setAttribute("transform", "rotate(" + minuteAngle + ")");
    minuteHit.setAttribute("transform", "rotate(" + minuteAngle + ")");

    // Digital
    const ampm = h24 < 12 ? I18N[lang].am : I18N[lang].pm;
    let h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    ampmEl.textContent = ampm;
    timeEl.textContent = String(h12).padStart(2, "0") + ":" + String(mm).padStart(2, "0");

    // Sky, sun, moon, label
    updateSky(m);
  }

  // Map minute-of-day to sky appearance
  function updateSky(m) {
    // Phase-based color stops
    // 0: deep night, 5: pre-dawn, 6: sunrise, 7: morning, 12: noon, 17: afternoon, 18: sunset, 19: dusk, 20+: night
    const t = m / 60; // hours 0..24

    // Build background gradient based on t
    const sky = pickSky(t);
    skyEl.style.background = sky.bg;

    // Sun position (visible 6:00 - 18:00). Arc from left to right.
    // t=6 => sun at horizon left, t=12 => zenith (top center), t=18 => horizon right
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const sunSize = 110;
    const moonSize = 95;

    if (t >= 5.5 && t <= 18.5) {
      // interpolate 0..1 across visible window
      const u = (t - 6) / 12; // -0.5/12 .. 1.0.../12
      // Arc: x linear from 0 to 1, y a sine curve peaking at middle
      const x = u * vw;
      const peak = vh * 0.12; // highest point
      const baseline = vh * 0.72; // horizon level (where it sets)
      const arc = Math.sin(Math.PI * u); // 0..1..0
      const y = baseline - (baseline - peak) * arc;
      sunEl.style.left = (x - sunSize / 2) + "px";
      sunEl.style.top = (y - sunSize / 2) + "px";
      sunEl.style.opacity = "1";
      // Soften/intensify glow near horizon
      const glowIntensity = Math.max(0.3, arc);
      sunEl.style.filter = "brightness(" + (0.85 + glowIntensity * 0.4) + ")";
    } else {
      sunEl.style.opacity = "0";
    }

    // Moon visible roughly 18:30 - 5:30 next day
    let moonT = null;
    if (t >= 18 || t <= 6) {
      moonT = t >= 18 ? (t - 18) : (t + 6); // 0..12
    }
    if (moonT !== null) {
      const u = moonT / 12;
      const x = u * vw;
      const peak = vh * 0.15;
      const baseline = vh * 0.72;
      const arc = Math.sin(Math.PI * u);
      const y = baseline - (baseline - peak) * arc;
      moonEl.style.left = (x - moonSize / 2) + "px";
      moonEl.style.top = (y - moonSize / 2) + "px";
      moonEl.style.opacity = "1";
    } else {
      moonEl.style.opacity = "0";
    }

    // Stars visible at night (fade in/out)
    let starOpacity = 0;
    if (t < 5) starOpacity = 1;
    else if (t < 6.5) starOpacity = 1 - (t - 5) / 1.5;
    else if (t > 19.5) starOpacity = Math.min(1, (t - 19.5) / 1.5);
    else starOpacity = 0;
    starsEl.style.opacity = starOpacity.toFixed(2);

    // Clouds visible during day
    let cloudOpacity = 0;
    if (t >= 7 && t <= 17) cloudOpacity = 0.9;
    else if (t >= 6 && t <= 18) cloudOpacity = 0.4;
    cloudsEl.style.opacity = cloudOpacity.toFixed(2);

    // Period label — exact noon/midnight override, otherwise time-of-day band
    const mmLocal = Math.floor(m % 60);
    const h24Local = Math.floor(m / 60);
    let pIdx;
    if (mmLocal === 0 && h24Local === 12) pIdx = 10;        // exact 12:00 PM
    else if (mmLocal === 0 && h24Local === 0) pIdx = 11;    // exact 12:00 AM
    else pIdx = periodIndex(t);
    periodEl.textContent = I18N[lang].periods[pIdx];
  }

  function periodIndex(t) {
    if (t < 5) return 0;        // Deep Night
    if (t < 6.5) return 1;      // Dawn
    if (t < 8) return 2;        // Sunrise
    if (t < 11) return 3;       // Morning
    if (t < 13) return 4;       // Midday
    if (t < 16) return 5;       // Afternoon
    if (t < 17.5) return 6;     // Late Afternoon
    if (t < 18.5) return 7;     // Sunset
    if (t < 20) return 8;       // Evening
    if (t < 22) return 9;       // Night (moon rising)
    return 0;                    // Deep Night
  }

  // Sky gradients defined at key hours; interpolate between them
  const skyKeyframes = [
    { t: 0.0,  colors: ["#0a0a2a", "#000010"] },  // deep night
    { t: 4.0,  colors: ["#0f1140", "#060820"] },
    { t: 5.0,  colors: ["#2a2a60", "#1a1a40"] },  // pre-dawn
    { t: 5.8,  colors: ["#6a5a9a", "#3a3a70", "#2a2a50"] }, // dawn
    { t: 6.3,  colors: ["#ff9a5b", "#ffc98a", "#ffd9a8"] }, // sunrise
    { t: 7.0,  colors: ["#ffd585", "#ffe8b0", "#c3e3ff"] }, // post-sunrise
    { t: 8.0,  colors: ["#a8d8ff", "#cce9ff", "#f0f6ff"] }, // morning
    { t: 12.0, colors: ["#4fb0ff", "#89c9ff", "#cfe6ff"] }, // noon
    { t: 15.0, colors: ["#5ea8ea", "#9cc8ea", "#e4f0fb"] }, // afternoon
    { t: 17.0, colors: ["#6aa3cf", "#f5b76b", "#ffd28f"] }, // late afternoon
    { t: 18.0, colors: ["#ef6a4a", "#f29261", "#ffc06a"] }, // sunset
    { t: 18.6, colors: ["#703070", "#d65a4a", "#f2995a"] }, // golden set
    { t: 19.3, colors: ["#2a224a", "#4a2a5a", "#8a3a5a"] }, // dusk
    { t: 20.5, colors: ["#131535", "#1f2050", "#2a2a5a"] }, // early night
    { t: 22.0, colors: ["#0b0b28", "#141438", "#1c1c45"] }, // night
    { t: 24.0, colors: ["#0a0a2a", "#000010"] }
  ];

  function lerpColor(a, b, k) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
    const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
    const r = Math.round(ar + (br - ar) * k);
    const g = Math.round(ag + (bg - ag) * k);
    const bl = Math.round(ab + (bb - ab) * k);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
  }

  function pickSky(t) {
    let a = skyKeyframes[0], b = skyKeyframes[skyKeyframes.length - 1];
    for (let i = 0; i < skyKeyframes.length - 1; i++) {
      if (t >= skyKeyframes[i].t && t <= skyKeyframes[i + 1].t) {
        a = skyKeyframes[i];
        b = skyKeyframes[i + 1];
        break;
      }
    }
    const k = (b.t === a.t) ? 0 : (t - a.t) / (b.t - a.t);

    // Match number of stops: use longer list, extend shorter with its last color
    const n = Math.max(a.colors.length, b.colors.length);
    const stops = [];
    for (let i = 0; i < n; i++) {
      const ac = a.colors[Math.min(i, a.colors.length - 1)];
      const bc = b.colors[Math.min(i, b.colors.length - 1)];
      stops.push(lerpColor(ac, bc, k));
    }
    const bg = "linear-gradient(to bottom, " + stops.join(", ") + ")";
    return { bg: bg };
  }

  // Drag logic for minute hand
  // We track angle changes; wrapping around advances or rewinds hours.
  let lastAngle = null;

  function getAngleFromEvent(e) {
    const rect = clockSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const p = ("touches" in e && e.touches.length > 0) ? e.touches[0] : e;
    const dx = p.clientX - cx;
    const dy = p.clientY - cy;
    // Angle in degrees, 0 at 12 o'clock, increasing clockwise
    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    return deg;
  }

  function onDown(e) {
    dragging = true;
    autoPlay = false;
    updateAutoPlayButton();
    lastAngle = getAngleFromEvent(e);
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    const ang = getAngleFromEvent(e);
    let delta = ang - lastAngle;
    // handle wrap-around (take shortest path)
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    lastAngle = ang;

    // Each degree = 60/360 = 1/6 minute
    const minuteDelta = delta / 6;
    totalMinutes = totalMinutes + minuteDelta;
    // keep in large cycle but normalized on display
    if (totalMinutes < -14400) totalMinutes += 1440 * 10;
    if (totalMinutes > 14400) totalMinutes -= 1440 * 10;
    update();
    e.preventDefault();
  }

  function onUp() {
    dragging = false;
    lastAngle = null;
  }

  function koMinutes(n) {

  function koSpeakify(text) {

        setTime: 12 * 60 + 5
      });
      lessons.minutes.push({ say: "그럼 1분부터 59분까지 함께 세어 볼까요?" });
    } else {
      lessons.minutes.push({
        say: "When the long hand points to 12, we only say the hour, so we say 12 o'clock.",
        highlight: ["minute-hand", "num-12"],
        setTime: 12 * 60
      });
      lessons.minutes.push({
        say: "Between each number, there are four small dots.",
        highlight: ["tick-1", "tick-2", "tick-3", "tick-4"],
        setTime: 12 * 60
      });
      lessons.minutes.push({
        say: "The dots have no numbers, but the first dot to the right of 12 is 1 minute.",
        highlight: ["tick-1", "minute-hand"],
        setTime: 12 * 60 + 1
      });
      lessons.minutes.push({
        say: "So 1, 2, 3, 4 minutes, and then number 1 becomes 5 minutes.",
        highlight: ["num-1"],
        setTime: 12 * 60 + 5
      });
      lessons.minutes.push({ say: "Now let's count from 1 to 59 minutes together!" });
    }
    for (let m = 1; m <= 59; m++) {
      const highlights = ["minute-hand", "tick-" + m];
      if (m % 5 === 0) highlights.push("num-" + (m / 5));
      lessons.minutes.push({
        say: (L === "ko" ? m + "분" : m + (m === 1 ? " minute" : " minutes")),
        highlight: highlights,
        setTime: 12 * 60 + m,
        wait: 150
      });
    }

    // --- Lesson 4: combined reading ---
    lessons.combined = [];
    if (L === "ko") {
      lessons.combined.push({ say: "그러면 이제 시계를 읽어봐요.", setTime: 1 * 60 });
    } else {
      lessons.combined.push({ say: "Now let's read the clock together.", setTime: 1 * 60 });
    }
    for (let m = 1; m <= 11; m++) {
      const mm = m * 5;
      const tm = 1 * 60 + mm;
      if (L === "ko") {
        lessons.combined.push({
          say: "1시 " + mm + "분",
          highlight: ["hour-hand", "minute-hand", "num-" + m],
          setTime: tm
        });
      } else {
        lessons.combined.push({
          say: "1 " + mm,
          highlight: ["hour-hand", "minute-hand", "num-" + m],
          setTime: tm
        });
      }
    }
    if (L === "ko") {
      lessons.combined.push({
        say: "짧은 바늘이 숫자 2에 있고, 긴 바늘이 숫자 12에 있으면 2시라고 말해요.",
        highlight: ["hour-hand", "minute-hand", "num-2", "num-12"],
        setTime: 2 * 60
      });
    } else {
      lessons.combined.push({
        say: "When the short hand is on 2 and the long hand is on 12, we say 2 o'clock.",
        highlight: ["hour-hand", "minute-hand", "num-2", "num-12"],
        setTime: 2 * 60
      });
    }
    for (let m = 6; m <= 9; m++) {
      const tm = 2 * 60 + m;
      if (L === "ko") {
        lessons.combined.push({
          say: "짧은 바늘이 숫자 2와 3 사이에 있고, 긴 바늘이 숫자 1 다음 점을 가리키면 2시 " + m + "분이에요.",
          highlight: ["hour-hand", "minute-hand", "tick-" + m, "sector-2"],
          setTime: tm
        });
      } else {
        lessons.combined.push({
          say: "When the short hand is between 2 and 3, and the long hand is on a dot after 1, it is 2 " + m + ".",
          highlight: ["hour-hand", "minute-hand", "tick-" + m, "sector-2"],
          setTime: tm
        });
      }
    }
    if (L === "ko") {
      lessons.combined.push({
        say: "짧은 바늘이 숫자 2와 3 사이에 있고, 긴 바늘이 숫자 2를 가리키면 2시 10분이라고 말해요.",
        highlight: ["hour-hand", "minute-hand", "num-2", "sector-2"],
        setTime: 2 * 60 + 10
      });
    } else {
      lessons.combined.push({
        say: "When the short hand is between 2 and 3, and the long hand is on 2, we say 2 10.",
        highlight: ["hour-hand", "minute-hand", "num-2", "sector-2"],
        setTime: 2 * 60 + 10
      });
    }

    // --- Lesson 5: AM/PM ---
    if (L === "ko") {
      lessons.ampm = [
        { say: "하루는 24시간이라고 해요." },
        { say: "시계에는 숫자 12까지밖에 없는데 어떻게 24시간일까요?" },
        { say: "짧은 바늘이 시계를 두 바퀴 돌면 그게 하루예요.", action: "rotateHour2", setTime: 12 * 60 },
        { say: "하루는 크게 오전과 오후가 있어요. 작게는 아침, 점심, 저녁, 밤이라고 불러요." },
        { say: "우리 모두 아침에 일어나서 하루를 시작하죠? 해님이 떠오른 그 시간을 우리는 아침이라고 불러요.", setTime: 7 * 60 },
        { say: "해님이 하늘 가장 높은 곳에 올라오면 점심시간이에요.", setTime: 12 * 60 },
        { say: "해님이 서쪽으로 지기 시작하면 저녁이에요.", setTime: 18 * 60 },
        { say: "달이 뜨고 어두워지면 밤이에요.", setTime: 22 * 60 },
        { say: "우리가 잠들고 나서, 밤 12시부터 점심 12시까지를 오전이라고 불러요.", setTime: 3 * 60 },
        { say: "그리고 점심 12시부터 밤 12시까지를 오후라고 불러요.", setTime: 15 * 60 },
        { say: "이렇게 해서 하루는 24시간이에요. 같은 이름의 시간이 하루에 두 번씩 있어요. 아침 7시, 그리고 오후 7시.", setTime: 7 * 60 },
        { say: "오후 7시는 이렇게 생겼어요.", setTime: 19 * 60 },
        { say: "시간의 이름을 더 세부적으로 나눌 수도 있어요. 하지만 우리는 아직 그 시간을 배우지는 않아요." }
      ];
    } else {
      lessons.ampm = [
        { say: "A day has 24 hours." },
        { say: "The clock only has numbers up to 12, so how can a day be 24 hours?" },
        { say: "When the short hand goes around the clock twice, that is one full day.", action: "rotateHour2", setTime: 12 * 60 },
        { say: "A day has morning, noon, evening, and night." },
        { say: "We wake up in the morning to start our day. When the sun rises, we call it morning.", setTime: 7 * 60 },
        { say: "When the sun is highest in the sky, it is noon.", setTime: 12 * 60 },
        { say: "When the sun sets in the west, it is evening.", setTime: 18 * 60 },
        { say: "When the moon rises and it gets dark, it is night.", setTime: 22 * 60 },
        { say: "From midnight to noon is called A.M.", setTime: 3 * 60 },
        { say: "From noon to midnight is called P.M.", setTime: 15 * 60 },
        { say: "So a day is 24 hours. The same time name happens twice a day. 7 A.M. and 7 P.M.", setTime: 7 * 60 },
        { say: "This is 7 P.M.", setTime: 19 * 60 },
        { say: "There are more detailed names for times, but we will learn those later." }
      ];
    }

    // --- Lesson 6: tricky (why 1:55 is not 2:55) ---
    if (L === "ko") {
      lessons.tricky = [
        {
          say: "이럴 땐 몇 시일까요? 긴 바늘이 12 근처에 있을 때 헷갈리지 않는 세 가지 비밀을 알려줄게요!",
          highlight: ["hour-hand", "minute-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "첫 번째 비밀! 아직 12라는 문을 넘지 못했어요. 짧은 바늘이 2에 아주 가까워 보이지만, 긴 바늘이 맨 위의 숫자 12라는 문을 완전히 띡 하고 통과해야 비로소 진짜 2시가 되는 거랍니다.",
          highlight: ["num-12", "minute-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "긴 바늘이 12를 띡 하고 넘어가는 모습을 보여줄게요.",
          action: "crossTwelve"
        },
        {
          say: "그래서 지금은 아직 2시가 되기 전인 1시예요!",
          highlight: ["num-1", "hour-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "두 번째 비밀! 1시에서 출발한 짧은 바늘이 2시 집을 향해 걸어가고 있어요. 55분이라는 건 2시 집 목적지에 거의 다 도착하긴 했지만, 아직 집 문 앞 골목길에 있는 상태예요. 그래서 아직은 1시 집의 영역에 있는 거랍니다!",
          highlight: ["sector-1", "hour-hand", "num-1", "num-2"],
          setTime: 1 * 60 + 55
        },
        {
          say: "세 번째 비밀! 시계를 볼 땐 긴 바늘을 먼저 찾아보세요! 긴 바늘이 시계의 왼쪽 동네에 가 있으면, 짧은 바늘이 가리키는 숫자보다 바로 전 숫자를 읽어야 해요. 긴 바늘이 12에 거의 다 왔지만 짧은 바늘은 아직 2시가 안 된 1시 55분이랍니다!",
          highlight: ["sector-6", "sector-7", "sector-8", "sector-9", "sector-10", "sector-11", "minute-hand", "hour-hand", "num-1"],
          setTime: 1 * 60 + 55
        },
        {
          say: "이제 긴 바늘이 12 근처에 있어도 헷갈리지 않겠죠? 참 잘했어요!",
          action: "flashClock",
          setTime: 1 * 60 + 55
        }
      ];
    } else {
      lessons.tricky = [
        {
          say: "What time is it in these tricky cases? Let me tell you three secrets so you don't get confused when the long hand is near 12!",
          highlight: ["hour-hand", "minute-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "First secret! The long hand hasn't passed through the 12 gate yet. The short hand looks very close to 2, but the long hand has to tick completely past the number 12 gate at the top for it to really become 2 o'clock.",
          highlight: ["num-12", "minute-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "Let's watch the long hand tick past 12.",
          action: "crossTwelve"
        },
        {
          say: "So right now it's still 1, before 2!",
          highlight: ["num-1", "hour-hand"],
          setTime: 1 * 60 + 55
        },
        {
          say: "Second secret! The short hand that started at 1 is walking toward house 2. 55 minutes means it has almost reached house 2, but it is still in the alley in front of the door. So it is still in the territory of house 1!",
          highlight: ["sector-1", "hour-hand", "num-1", "num-2"],
          setTime: 1 * 60 + 55
        },
        {
          say: "Third secret! When you look at the clock, find the long hand first! If the long hand is on the left side of the clock, you should read the number right before the one the short hand is pointing to. The long hand is almost at 12, but the short hand hasn't reached 2 yet, so it's 1:55!",
          highlight: ["sector-6", "sector-7", "sector-8", "sector-9", "sector-10", "sector-11", "minute-hand", "hour-hand", "num-1"],
          setTime: 1 * 60 + 55
        },
        {
          say: "Now you won't be confused even when the long hand is near 12. Great job!",
          action: "flashClock",
          setTime: 1 * 60 + 55
        }
      ];
    }

    return lessons;
  }

  // Lesson runner state
  let lessonSteps = null;
  let lessonIdx = 0;
  let lessonPlaying = false;
  let lessonPaused = false;
  let lessonBusy = false;
  let currentUtteranceId = null;
  let pendingTimeout = null;
  let activeAction = null;

  const learnControls = document.getElementById("learn-controls");
  const btnLearn = document.getElementById("btn-learn");
  const learnMenu = document.getElementById("learn-menu");
  const lessonPlayer = document.getElementById("lesson-player");
  const lessonTitleEl = document.getElementById("lesson-title");
  const lessonTextEl = document.getElementById("lesson-text");
  const lessonBtnPrev = document.getElementById("lesson-prev");
  const lessonBtnPause = document.getElementById("lesson-pause");
  const lessonBtnNext = document.getElementById("lesson-next");
  const lessonBtnClose = document.getElementById("lesson-close");

  function updateLearnButtonLabels() {
    btnLearn.textContent = LESSON_UI[lang].learn;
    document.querySelectorAll(".learn-item").forEach(function(btn) {
      const key = btn.getAttribute("data-lesson");
      btn.textContent = LESSON_UI[lang].items[key];
    });
  }

  btnLearn.addEventListener("click", function() {
    learnControls.classList.toggle("open");
  });

  document.querySelectorAll(".learn-item").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const key = btn.getAttribute("data-lesson");
      learnControls.classList.remove("open");
      startLesson(key);
    });
  });

  function clearHighlights() {
    document.querySelectorAll(".hl-hand, .hl-sector, .hl-number, .hl-tick").forEach(function(el) {
      el.classList.remove("hl-hand", "hl-sector", "hl-number", "hl-tick");
    });
  }

  function applyHighlights(ids) {
    if (!ids) return;
    const list = Array.isArray(ids) ? ids : [ids];
    list.forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      if (id === "hour-hand" || id === "minute-hand") {
        el.classList.add("hl-hand");
      } else if (id.startsWith("num-")) {
        el.classList.add("hl-number");
      } else if (id.startsWith("sector-")) {
        el.classList.add("hl-sector");
      } else if (id.startsWith("tick-")) {
        el.classList.add("hl-tick");
      }
    });
  }

  function cancelSpeech() {
    currentUtteranceId = null;
    window.__onTtsDone = null;
    if (window.AndroidTTS && typeof window.AndroidTTS.stop === "function") {
      try { window.AndroidTTS.stop(); } catch (e) {}
    }
    if (window.speechSynthesis) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    if (pendingTimeout) {
      clearTimeout(pendingTimeout);
      pendingTimeout = null;
    }
  }

  function speakAndWait(text, onDone) {
    currentUtteranceId = "utt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8);
    const myId = currentUtteranceId;
    const spokenText = (lang === "ko") ? koSpeakify(text) : text;

    const finish = function() {
      if (myId !== currentUtteranceId) return;
      window.__onTtsDone = null;
      onDone();
    };

    const androidOk = window.AndroidTTS && typeof window.AndroidTTS.isAvailable === "function" && window.AndroidTTS.isAvailable();
    if (androidOk) {
      window.__onTtsDone = function(id) {
        if (id === myId) finish();
      };
      try {
        window.AndroidTTS.speak(spokenText, lang, myId);
        return;
      } catch (e) {}
    }

    if (window.speechSynthesis) {
      try {
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(spokenText);
        utt.lang = lang === "ko" ? "ko-KR" : "en-US";
        utt.rate = 0.95;
        utt.pitch = 1.05;
        utt.onend = finish;
        utt.onerror = finish;
        window.speechSynthesis.speak(utt);
        return;
      } catch (e) {}
    }

    pendingTimeout = setTimeout(finish, Math.max(1200, spokenText.length * 85));
  }

  function animateCrossTwelve(onDone) {
    const startT = performance.now();
    const duration = 2200;
    const fromTm = 1 * 60 + 55;
    const toTm = 2 * 60 + 2;
    totalMinutes = fromTm;
    update();
    activeAction = "cross";
    function frame(now) {
      if (!lessonPlaying || activeAction !== "cross") return;
      const t = Math.min(1, (now - startT) / duration);
      totalMinutes = fromTm + (toTm - fromTm) * t;
      update();
      // Keep num-12 blinking during the crossing
      const n12 = document.getElementById("num-12");
      if (n12 && !n12.classList.contains("hl-number")) n12.classList.add("hl-number");
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        activeAction = null;
        onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  function animateHourRotation2(onDone) {
    const startT = performance.now();
    const duration = 4000;
    const startM = totalMinutes;
    activeAction = "rotate";
    function frame(now) {
      if (!lessonPlaying || activeAction !== "rotate") return;
      const t = Math.min(1, (now - startT) / duration);
      totalMinutes = startM + t * 1440;
      update();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        totalMinutes = startM;
        update();
        activeAction = null;
        onDone();
      }
    }
    requestAnimationFrame(frame);
  }

  function runStep() {
    if (!lessonPlaying || !lessonSteps) return;
    if (lessonIdx < 0) lessonIdx = 0;
    if (lessonIdx >= lessonSteps.length) {
      stopLesson();
      return;
    }
    lessonBusy = true;
    clearHighlights();
    const step = lessonSteps[lessonIdx];
    if (typeof step.setTime === "number") {
      totalMinutes = step.setTime;
      update();
    }
    if (typeof step.hourHandDeg === "number") {
      hourHand.setAttribute("transform", "rotate(" + step.hourHandDeg + ")");
    }
    if (typeof step.minuteHandDeg === "number") {
      minuteHand.setAttribute("transform", "rotate(" + step.minuteHandDeg + ")");
      minuteHit.setAttribute("transform", "rotate(" + step.minuteHandDeg + ")");
    }
    applyHighlights(step.highlight);
    lessonTextEl.textContent = step.say || "";

    const afterSpeak = function() {
      if (!lessonPlaying) return;
      const extraWait = typeof step.wait === "number" ? step.wait : 350;
      pendingTimeout = setTimeout(function() {
        lessonBusy = false;
        if (!lessonPlaying || lessonPaused) return;
        lessonIdx++;
        runStep();
      }, extraWait);
    };

    if (step.action === "rotateHour2") {
      animateHourRotation2(function() {
        if (step.say) {
          speakAndWait(step.say, afterSpeak);
        } else {
          afterSpeak();
        }
      });
    } else if (step.action === "crossTwelve") {
      if (step.say) {
        speakAndWait(step.say, function() {
          animateCrossTwelve(afterSpeak);
        });
      } else {
        animateCrossTwelve(afterSpeak);
      }
    } else if (step.action === "flashClock") {
      const svg = document.getElementById("clock-svg");
      svg.classList.add("flashing");
      setTimeout(function() { svg.classList.remove("flashing"); }, 1800);
      if (step.say) {
        speakAndWait(step.say, afterSpeak);
      } else {
        pendingTimeout = setTimeout(afterSpeak, 1800);
      }
    } else if (step.say) {
      speakAndWait(step.say, afterSpeak);
    } else {
      pendingTimeout = setTimeout(afterSpeak, 500);
    }
  }

  function startLesson(key) {
    stopLesson();
    const data = buildLessons(lang);
    if (!data[key]) return;
    autoPlay = false;
    updateAutoPlayButton();
    lessonSteps = data[key];
    lessonIdx = 0;
    lessonPlaying = true;
    lessonPaused = false;
    lessonTitleEl.textContent = LESSON_UI[lang].titles[key];
    lessonPlayer.classList.add("active");
    lessonBtnPause.textContent = LESSON_UI[lang].pause;
    runStep();
  }

  function stopLesson() {
    lessonPlaying = false;
    lessonPaused = false;
    lessonBusy = false;
    activeAction = null;
    cancelSpeech();
    clearHighlights();
    lessonSteps = null;
    lessonIdx = 0;
    lessonPlayer.classList.remove("active");
    lessonTextEl.textContent = "";
    lessonTitleEl.textContent = "";
  }

  lessonBtnPrev.addEventListener("click", function() {
    if (!lessonPlaying) return;
    cancelSpeech();
    lessonIdx = Math.max(0, lessonIdx - 1);
    lessonPaused = false;
    lessonBtnPause.textContent = LESSON_UI[lang].pause;
    runStep();
  });

  lessonBtnNext.addEventListener("click", function() {
    if (!lessonPlaying) return;
    cancelSpeech();
    lessonIdx++;
    lessonPaused = false;
    lessonBtnPause.textContent = LESSON_UI[lang].pause;
    runStep();
  });

  lessonBtnPause.addEventListener("click", function() {
    if (!lessonPlaying) return;
    if (lessonPaused) {
      lessonPaused = false;
      lessonBtnPause.textContent = LESSON_UI[lang].pause;
      runStep();
    } else {
      lessonPaused = true;
      lessonBtnPause.textContent = LESSON_UI[lang].resume;
      cancelSpeech();
    }
  });

  lessonBtnClose.addEventListener("click", stopLesson);

  // Rebuild labels when language changes
  const _origApplyLang = applyLang;
  applyLang = function() {
    _origApplyLang();
    updateLearnButtonLabels();
    if (lessonPlaying) stopLesson();
  };

  updateLearnButtonLabels();
})();
</script>
