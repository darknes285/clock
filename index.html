<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>우리 아이 시계 배우기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "맑은 고딕", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    user-select: none;
    touch-action: pan-y;
  }

  #sky {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    transition: background 1.5s ease;
    z-index: 0;
  }

  #stars {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.5s ease;
  }

  .star {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  #celestial {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 2;
  }

  .sun, .moon {
    position: absolute;
    border-radius: 50%;
    transition: filter 1.5s ease;
  }

  .sun {
    width: 110px; height: 110px;
    background: radial-gradient(circle at 35% 35%, #fff4a3, #ffcf33 55%, #ff9a1c 100%);
    box-shadow:
      0 0 60px 20px rgba(255, 207, 51, 0.55),
      0 0 120px 40px rgba(255, 154, 28, 0.35);
  }

  .moon {
    width: 95px; height: 95px;
    background: radial-gradient(circle at 35% 35%, #ffffff, #e5e9ff 55%, #b7bfd9 100%);
    box-shadow: 0 0 40px 10px rgba(230, 236, 255, 0.5);
  }
  .moon::before, .moon::after {
    content: "";
    position: absolute;
    background: rgba(170, 175, 195, 0.35);
    border-radius: 50%;
  }
  .moon::before { width: 18px; height: 18px; top: 25px; left: 22px; }
  .moon::after  { width: 12px; height: 12px; top: 55px; left: 55px; }

  #clouds {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 3;
    opacity: 0;
    transition: opacity 1.5s ease;
  }
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.85);
    border-radius: 50%;
    filter: blur(2px);
  }

  #main {
    position: relative;
    z-index: 10;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 10px;
  }

  #period-label {
    font-size: clamp(22px, 3.5vw, 36px);
    font-weight: 800;
    color: #ffffff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.18);
    padding: 6px 22px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  #clock-wrap {
    position: relative;
    width: min(70vmin, 520px);
    aspect-ratio: 1 / 1;
  }

  #clock-svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 10px 30px rgba(0,0,0,0.25));
  }

  .clock-face { fill: #fffdf6; stroke: #2a2a2a; stroke-width: 4; }
  .clock-rim { fill: none; stroke: #c9a24b; stroke-width: 10; }
  .clock-inner-rim { fill: none; stroke: #8a6d2a; stroke-width: 2; }

  .tick-hour { stroke: #1a1a1a; stroke-width: 4; stroke-linecap: round; }
  .tick-minute { stroke: #555; stroke-width: 1.5; stroke-linecap: round; }

  #hour-colors { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  #hour-colors.on { opacity: 1; }
  .hour-color-line { stroke-width: 3; stroke-linecap: round; }

  #hour-sectors { opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
  #hour-sectors.on { opacity: 0.55; }
  .hour-sector { stroke: none; }

  .number {
    paint-order: stroke;
    stroke: #ffffff;
    stroke-width: 3;
    stroke-linejoin: round;
  }

  .number {
    fill: #1a1a1a;
    font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
    font-weight: 800;
    text-anchor: middle;
    dominant-baseline: central;
  }

  .hour-hand {
    stroke: #1a1a1a;
    stroke-width: 10;
    stroke-linecap: round;
    pointer-events: none;
  }
  .minute-hand {
    stroke: #2a4ea8;
    stroke-width: 7;
    stroke-linecap: round;
    cursor: grab;
    touch-action: none;
  }
  .minute-hand:active { cursor: grabbing; }

  .minute-hit {
    stroke: transparent;
    stroke-width: 36;
    stroke-linecap: round;
    cursor: grab;
    touch-action: none;
  }
  .minute-hit:active { cursor: grabbing; }

  .center-dot { fill: #c9a24b; stroke: #1a1a1a; stroke-width: 2; }
  .center-dot-inner { fill: #1a1a1a; }

  #digital {
    display: flex;
    align-items: baseline;
    gap: 14px;
    background: rgba(0,0,0,0.35);
    color: #fff;
    padding: 12px 28px;
    border-radius: 18px;
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  #ampm {
    font-size: clamp(22px, 3vw, 32px);
    font-weight: 800;
    letter-spacing: 2px;
    color: #ffd86b;
  }

  /* English mode: show time first, then lowercase am/pm attached (no gap) */
  html[lang="en"] #digital { gap: 0; }
  html[lang="en"] #time { order: 1; }
  html[lang="en"] #ampm {
    order: 2;
    font-size: clamp(18px, 2.4vw, 26px);
    letter-spacing: 0;
    margin-left: 0;
  }


  #time {
    font-family: "Consolas", "Menlo", "맑은 고딕", monospace;
    font-size: clamp(42px, 6.5vw, 72px);
    font-weight: 800;
    letter-spacing: 3px;
  }

  #hint {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translate(-50%, 0);
    z-index: 11;
    font-size: 14px;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.25);
    padding: 6px 14px;
    border-radius: 999px;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    transition: transform 0.9s ease, opacity 0.9s ease;
  }
  #hint.hidden {
    transform: translate(-50%, 160%);
    opacity: 0;
  }

  #controls {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 12;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  #menu-items {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .btn {
    background: rgba(255,255,255,0.9);
    border: 2px solid #c9a24b;
    color: #333;
    font-weight: 700;
    font-size: 15px;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    white-space: nowrap;
  }
  .btn:hover { background: #fff; }
  .btn.active { background: #ffd86b; border-color: #8a6d2a; }

  #btn-menu {
    display: none;
    font-size: 20px;
    padding: 6px 12px;
    line-height: 1;
  }

  @media (max-width: 1235px) {
    #controls {
      flex-direction: column;
      align-items: flex-end;
    }
    #btn-menu {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      order: 1;
    }
    #menu-items {
      order: 2;
      flex-direction: column;
      align-items: stretch;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease;
      pointer-events: none;
    }
    #controls.open #menu-items {
      max-height: 80vh;
      opacity: 1;
      pointer-events: auto;
    }
  }
</style>
</head>
<body>
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="clouds"></div>
  <div id="celestial">
    <div class="sun" id="sun"></div>
    <div class="moon" id="moon"></div>
  </div>

  <div id="controls">
    <div id="menu-items">
      <button class="btn" id="btn-lang">English</button>
      <button class="btn" id="btn-colors">색상</button>
      <button class="btn" id="btn-now">지금 시간</button>
      <button class="btn" id="btn-play">자동 재생 ▶</button>
    </div>
    <button class="btn" id="btn-menu" aria-label="Menu">☰</button>
  </div>

  <div id="main">
    <div id="period-label">아침</div>

    <div id="clock-wrap">
      <svg id="clock-svg" viewBox="-200 -200 400 400">
        <circle class="clock-rim" cx="0" cy="0" r="192"/>
        <circle class="clock-face" cx="0" cy="0" r="185"/>
        <g id="hour-sectors"></g>
        <circle class="clock-inner-rim" cx="0" cy="0" r="170"/>
        <g id="ticks"></g>
        <g id="hour-colors"></g>
        <g id="numbers"></g>

        <line class="hour-hand" id="hour-hand" x1="0" y1="0" x2="0" y2="-90"/>
        <line class="minute-hand" id="minute-hand" x1="0" y1="0" x2="0" y2="-135"/>
        <line class="minute-hit" id="minute-hit" x1="0" y1="0" x2="0" y2="-150"/>

        <circle class="center-dot" cx="0" cy="0" r="12"/>
        <circle class="center-dot-inner" cx="0" cy="0" r="4"/>
      </svg>
    </div>

    <div id="digital">
      <span id="ampm">오전</span>
      <span id="time">10:10</span>
    </div>
  </div>

  <div id="hint">긴 바늘(파란 바늘)을 잡고 돌려 보세요</div>

<script>
(function() {
  "use strict";

  // Total minutes since midnight: 0 .. 1440 (exclusive)
  const _now = new Date();
  let totalMinutes = _now.getHours() * 60 + _now.getMinutes(); // start at current time
  let dragging = false;
  let autoPlay = false;
  let autoPlayStart = 0;
  let autoPlayStartMinutes = 0;
  let lang = "en"; // "ko" or "en" — default English
  let colorsOn = false;
  let menuOpen = false;

  // Colors for each hour 1..12 (index 0 = 12 o'clock / top)
  const HOUR_COLORS = [
    "#e53935", // 12 - red
    "#fb8c00", // 1  - orange
    "#fdd835", // 2  - yellow
    "#7cb342", // 3  - light green
    "#2e7d32", // 4  - green
    "#26c6da", // 5  - cyan
    "#1e88e5", // 6  - blue
    "#1a237e", // 7  - navy
    "#6a1b9a", // 8  - purple
    "#c2185b", // 9  - magenta/red
    "#424242", // 10 - dark gray/black
    "#00838f"  // 11 - teal
  ];

  const I18N = {
    ko: {
      title: "우리 아이 시계 배우기",
      btnLangOther: "English",
      btnColorsOn: "색상 끄기",
      btnColorsOff: "색상",
      btnNow: "지금 시간",
      btnPlay: "자동 재생 ▶",
      btnStop: "자동 재생 ■",
      am: "오전",
      pm: "오후",
      hint: "긴 바늘(파란 바늘)을 잡고 돌려 보세요",
      periods: [
        "깊은 밤",
        "새벽 (해가 떠오르는 중)",
        "아침 해돋이",
        "아침",
        "한낮 (해가 중천에)",
        "오후",
        "늦은 오후",
        "저녁 노을 (해가 지는 중)",
        "저녁",
        "밤 (달이 떠오름)",
        "정오 (해가 가장 높은 때)",
        "자정 (하루가 바뀌는 때)"
      ]
    },
    en: {
      title: "Kids Clock Learning",
      btnLangOther: "한국어",
      btnColorsOn: "Colors Off",
      btnColorsOff: "Colors",
      btnNow: "Now",
      btnPlay: "Auto Play ▶",
      btnStop: "Auto Play ■",
      am: "a.m.",
      pm: "p.m.",
      hint: "Grab the long (blue) hand and drag it",
      periods: [
        "Deep Night",
        "Dawn (sun rising)",
        "Morning Sunrise",
        "Morning",
        "Midday (sun at zenith)",
        "Afternoon",
        "Late Afternoon",
        "Sunset (sun setting)",
        "Evening",
        "Night (moon rising)",
        "Noon (sun is highest)",
        "Midnight (a new day begins)"
      ]
    }
  };

  const skyEl = document.getElementById("sky");
  const starsEl = document.getElementById("stars");
  const cloudsEl = document.getElementById("clouds");
  const sunEl = document.getElementById("sun");
  const moonEl = document.getElementById("moon");
  const hourHand = document.getElementById("hour-hand");
  const minuteHand = document.getElementById("minute-hand");
  const minuteHit = document.getElementById("minute-hit");
  const minuteHitFallback = minuteHand; // backup
  const ampmEl = document.getElementById("ampm");
  const timeEl = document.getElementById("time");
  const periodEl = document.getElementById("period-label");
  const clockSvg = document.getElementById("clock-svg");
  const ticksG = document.getElementById("ticks");
  const numbersG = document.getElementById("numbers");
  const hourColorsG = document.getElementById("hour-colors");
  const hourSectorsG = document.getElementById("hour-sectors");
  const hintEl = document.getElementById("hint");
  const btnLang = document.getElementById("btn-lang");
  const btnColors = document.getElementById("btn-colors");
  const btnNow = document.getElementById("btn-now");
  const btnMenu = document.getElementById("btn-menu");
  const controlsEl = document.getElementById("controls");

  // Build ticks
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180;
    const outer = 180;
    const inner = i % 5 === 0 ? 158 : 168;
    const x1 = Math.sin(angle) * inner;
    const y1 = -Math.cos(angle) * inner;
    const x2 = Math.sin(angle) * outer;
    const y2 = -Math.cos(angle) * outer;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", i % 5 === 0 ? "tick-hour" : "tick-minute");
    ticksG.appendChild(line);
  }

  // Build hour numbers
  for (let h = 1; h <= 12; h++) {
    const angle = (h * 30) * Math.PI / 180;
    const r = 135;
    const x = Math.sin(angle) * r;
    const y = -Math.cos(angle) * r;
    const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
    t.setAttribute("x", x);
    t.setAttribute("y", y);
    t.setAttribute("class", "number");
    t.setAttribute("font-size", "34");
    t.textContent = String(h);
    numbersG.appendChild(t);
  }

  // Build hour color lines (hidden until toggled on). From center to each hour mark.
  for (let h = 0; h < 12; h++) {
    const angle = (h * 30) * Math.PI / 180;
    const r = 155;
    const x2 = Math.sin(angle) * r;
    const y2 = -Math.cos(angle) * r;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", 0);
    line.setAttribute("y1", 0);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.setAttribute("class", "hour-color-line");
    line.setAttribute("stroke", HOUR_COLORS[h]);
    hourColorsG.appendChild(line);
  }

  // Build hour sectors (pie wedges between adjacent hour marks). Each is filled
  // with the color of the hour the sector STARTS at (sector h-> h+1 uses HOUR_COLORS[h]).
  for (let h = 0; h < 12; h++) {
    const startDeg = h * 30;
    const endDeg = (h + 1) * 30;
    const startA = startDeg * Math.PI / 180;
    const endA = endDeg * Math.PI / 180;
    const r = 170; // fill up to the inner rim
    const x1 = Math.sin(startA) * r;
    const y1 = -Math.cos(startA) * r;
    const x2 = Math.sin(endA) * r;
    const y2 = -Math.cos(endA) * r;
    const d = "M 0 0 L " + x1 + " " + y1 + " A " + r + " " + r + " 0 0 1 " + x2 + " " + y2 + " Z";
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", "hour-sector");
    path.setAttribute("fill", HOUR_COLORS[h]);
    hourSectorsG.appendChild(path);
  }

  // Build stars
  const NUM_STARS = 80;
  for (let i = 0; i < NUM_STARS; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = Math.random() * 2 + 1;
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = (Math.random() * 100) + "vw";
    s.style.top = (Math.random() * 65) + "vh";
    s.style.animationDelay = (Math.random() * 3) + "s";
    starsEl.appendChild(s);
  }

  // Build clouds
  function makeCloud(x, y, scale) {
    const c = document.createElement("div");
    c.className = "cloud";
    const w = 160 * scale, h = 60 * scale;
    c.style.width = w + "px";
    c.style.height = h + "px";
    c.style.borderRadius = "60px";
    c.style.left = x + "vw";
    c.style.top = y + "vh";
    cloudsEl.appendChild(c);

    const puff1 = document.createElement("div");
    puff1.className = "cloud";
    puff1.style.width = (80 * scale) + "px";
    puff1.style.height = (80 * scale) + "px";
    puff1.style.left = "calc(" + x + "vw + " + (30 * scale) + "px)";
    puff1.style.top = "calc(" + y + "vh - " + (30 * scale) + "px)";
    cloudsEl.appendChild(puff1);

    const puff2 = document.createElement("div");
    puff2.className = "cloud";
    puff2.style.width = (60 * scale) + "px";
    puff2.style.height = (60 * scale) + "px";
    puff2.style.left = "calc(" + x + "vw + " + (90 * scale) + "px)";
    puff2.style.top = "calc(" + y + "vh - " + (20 * scale) + "px)";
    cloudsEl.appendChild(puff2);
  }
  makeCloud(8, 18, 1.0);
  makeCloud(70, 10, 1.3);
  makeCloud(45, 25, 0.8);
  makeCloud(85, 30, 0.9);

  // Normalize minutes to [0, 1440)
  function normalize(m) {
    m = m % 1440;
    if (m < 0) m += 1440;
    return m;
  }

  // Update display based on totalMinutes
  function update() {
    const m = normalize(totalMinutes);
    const h24 = Math.floor(m / 60);
    const mm = Math.floor(m % 60);

    // Hands
    const minuteAngle = (m % 60) * 6; // 0-360 over 60 minutes
    const hourAngle = ((m % 720) / 720) * 360; // 0-360 over 12 hours (smooth)
    hourHand.setAttribute("transform", "rotate(" + hourAngle + ")");
    minuteHand.setAttribute("transform", "rotate(" + minuteAngle + ")");
    minuteHit.setAttribute("transform", "rotate(" + minuteAngle + ")");

    // Digital
    const ampm = h24 < 12 ? I18N[lang].am : I18N[lang].pm;
    let h12 = h24 % 12;
    if (h12 === 0) h12 = 12;
    ampmEl.textContent = ampm;
    timeEl.textContent = String(h12).padStart(2, "0") + ":" + String(mm).padStart(2, "0");

    // Sky, sun, moon, label
    updateSky(m);
  }

  // Map minute-of-day to sky appearance
  function updateSky(m) {
    // Phase-based color stops
    // 0: deep night, 5: pre-dawn, 6: sunrise, 7: morning, 12: noon, 17: afternoon, 18: sunset, 19: dusk, 20+: night
    const t = m / 60; // hours 0..24

    // Build background gradient based on t
    const sky = pickSky(t);
    skyEl.style.background = sky.bg;

    // Sun position (visible 6:00 - 18:00). Arc from left to right.
    // t=6 => sun at horizon left, t=12 => zenith (top center), t=18 => horizon right
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const sunSize = 110;
    const moonSize = 95;

    if (t >= 5.5 && t <= 18.5) {
      // interpolate 0..1 across visible window
      const u = (t - 6) / 12; // -0.5/12 .. 1.0.../12
      // Arc: x linear from 0 to 1, y a sine curve peaking at middle
      const x = u * vw;
      const peak = vh * 0.12; // highest point
      const baseline = vh * 0.72; // horizon level (where it sets)
      const arc = Math.sin(Math.PI * u); // 0..1..0
      const y = baseline - (baseline - peak) * arc;
      sunEl.style.left = (x - sunSize / 2) + "px";
      sunEl.style.top = (y - sunSize / 2) + "px";
      sunEl.style.opacity = "1";
      // Soften/intensify glow near horizon
      const glowIntensity = Math.max(0.3, arc);
      sunEl.style.filter = "brightness(" + (0.85 + glowIntensity * 0.4) + ")";
    } else {
      sunEl.style.opacity = "0";
    }

    // Moon visible roughly 18:30 - 5:30 next day
    let moonT = null;
    if (t >= 18 || t <= 6) {
      moonT = t >= 18 ? (t - 18) : (t + 6); // 0..12
    }
    if (moonT !== null) {
      const u = moonT / 12;
      const x = u * vw;
      const peak = vh * 0.15;
      const baseline = vh * 0.72;
      const arc = Math.sin(Math.PI * u);
      const y = baseline - (baseline - peak) * arc;
      moonEl.style.left = (x - moonSize / 2) + "px";
      moonEl.style.top = (y - moonSize / 2) + "px";
      moonEl.style.opacity = "1";
    } else {
      moonEl.style.opacity = "0";
    }

    // Stars visible at night (fade in/out)
    let starOpacity = 0;
    if (t < 5) starOpacity = 1;
    else if (t < 6.5) starOpacity = 1 - (t - 5) / 1.5;
    else if (t > 19.5) starOpacity = Math.min(1, (t - 19.5) / 1.5);
    else starOpacity = 0;
    starsEl.style.opacity = starOpacity.toFixed(2);

    // Clouds visible during day
    let cloudOpacity = 0;
    if (t >= 7 && t <= 17) cloudOpacity = 0.9;
    else if (t >= 6 && t <= 18) cloudOpacity = 0.4;
    cloudsEl.style.opacity = cloudOpacity.toFixed(2);

    // Period label — exact noon/midnight override, otherwise time-of-day band
    const mmLocal = Math.floor(m % 60);
    const h24Local = Math.floor(m / 60);
    let pIdx;
    if (mmLocal === 0 && h24Local === 12) pIdx = 10;        // exact 12:00 PM
    else if (mmLocal === 0 && h24Local === 0) pIdx = 11;    // exact 12:00 AM
    else pIdx = periodIndex(t);
    periodEl.textContent = I18N[lang].periods[pIdx];
  }

  function periodIndex(t) {
    if (t < 5) return 0;        // Deep Night
    if (t < 6.5) return 1;      // Dawn
    if (t < 8) return 2;        // Sunrise
    if (t < 11) return 3;       // Morning
    if (t < 13) return 4;       // Midday
    if (t < 16) return 5;       // Afternoon
    if (t < 17.5) return 6;     // Late Afternoon
    if (t < 18.5) return 7;     // Sunset
    if (t < 20) return 8;       // Evening
    if (t < 22) return 9;       // Night (moon rising)
    return 0;                    // Deep Night
  }

  // Sky gradients defined at key hours; interpolate between them
  const skyKeyframes = [
    { t: 0.0,  colors: ["#0a0a2a", "#000010"] },  // deep night
    { t: 4.0,  colors: ["#0f1140", "#060820"] },
    { t: 5.0,  colors: ["#2a2a60", "#1a1a40"] },  // pre-dawn
    { t: 5.8,  colors: ["#6a5a9a", "#3a3a70", "#2a2a50"] }, // dawn
    { t: 6.3,  colors: ["#ff9a5b", "#ffc98a", "#ffd9a8"] }, // sunrise
    { t: 7.0,  colors: ["#ffd585", "#ffe8b0", "#c3e3ff"] }, // post-sunrise
    { t: 8.0,  colors: ["#a8d8ff", "#cce9ff", "#f0f6ff"] }, // morning
    { t: 12.0, colors: ["#4fb0ff", "#89c9ff", "#cfe6ff"] }, // noon
    { t: 15.0, colors: ["#5ea8ea", "#9cc8ea", "#e4f0fb"] }, // afternoon
    { t: 17.0, colors: ["#6aa3cf", "#f5b76b", "#ffd28f"] }, // late afternoon
    { t: 18.0, colors: ["#ef6a4a", "#f29261", "#ffc06a"] }, // sunset
    { t: 18.6, colors: ["#703070", "#d65a4a", "#f2995a"] }, // golden set
    { t: 19.3, colors: ["#2a224a", "#4a2a5a", "#8a3a5a"] }, // dusk
    { t: 20.5, colors: ["#131535", "#1f2050", "#2a2a5a"] }, // early night
    { t: 22.0, colors: ["#0b0b28", "#141438", "#1c1c45"] }, // night
    { t: 24.0, colors: ["#0a0a2a", "#000010"] }
  ];

  function lerpColor(a, b, k) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
    const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
    const r = Math.round(ar + (br - ar) * k);
    const g = Math.round(ag + (bg - ag) * k);
    const bl = Math.round(ab + (bb - ab) * k);
    return "#" + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
  }

  function pickSky(t) {
    let a = skyKeyframes[0], b = skyKeyframes[skyKeyframes.length - 1];
    for (let i = 0; i < skyKeyframes.length - 1; i++) {
      if (t >= skyKeyframes[i].t && t <= skyKeyframes[i + 1].t) {
        a = skyKeyframes[i];
        b = skyKeyframes[i + 1];
        break;
      }
    }
    const k = (b.t === a.t) ? 0 : (t - a.t) / (b.t - a.t);

    // Match number of stops: use longer list, extend shorter with its last color
    const n = Math.max(a.colors.length, b.colors.length);
    const stops = [];
    for (let i = 0; i < n; i++) {
      const ac = a.colors[Math.min(i, a.colors.length - 1)];
      const bc = b.colors[Math.min(i, b.colors.length - 1)];
      stops.push(lerpColor(ac, bc, k));
    }
    const bg = "linear-gradient(to bottom, " + stops.join(", ") + ")";
    return { bg: bg };
  }

  // Drag logic for minute hand
  // We track angle changes; wrapping around advances or rewinds hours.
  let lastAngle = null;

  function getAngleFromEvent(e) {
    const rect = clockSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const p = ("touches" in e && e.touches.length > 0) ? e.touches[0] : e;
    const dx = p.clientX - cx;
    const dy = p.clientY - cy;
    // Angle in degrees, 0 at 12 o'clock, increasing clockwise
    let deg = Math.atan2(dx, -dy) * 180 / Math.PI;
    if (deg < 0) deg += 360;
    return deg;
  }

  function onDown(e) {
    dragging = true;
    autoPlay = false;
    updateAutoPlayButton();
    lastAngle = getAngleFromEvent(e);
    e.preventDefault();
  }

  function onMove(e) {
    if (!dragging) return;
    const ang = getAngleFromEvent(e);
    let delta = ang - lastAngle;
    // handle wrap-around (take shortest path)
    if (delta > 180) delta -= 360;
    if (delta < -180) delta += 360;
    lastAngle = ang;

    // Each degree = 60/360 = 1/6 minute
    const minuteDelta = delta / 6;
    totalMinutes = totalMinutes + minuteDelta;
    // keep in large cycle but normalized on display
    if (totalMinutes < -14400) totalMinutes += 1440 * 10;
    if (totalMinutes > 14400) totalMinutes -= 1440 * 10;
    update();
    e.preventDefault();
  }

  function onUp() {
    dragging = false;
    lastAngle = null;
  }

  // Attach to both the visible hand and the invisible fat hit area
  [minuteHand, minuteHit].forEach(function(el) {
    el.addEventListener("mousedown", onDown);
    el.addEventListener("touchstart", onDown, { passive: false });
  });
  document.addEventListener("mousemove", onMove);
  document.addEventListener("touchmove", onMove, { passive: false });
  document.addEventListener("mouseup", onUp);
  document.addEventListener("touchend", onUp);
  document.addEventListener("touchcancel", onUp);

  // Buttons
  btnNow.addEventListener("click", function() {
    const d = new Date();
    totalMinutes = d.getHours() * 60 + d.getMinutes();
    autoPlay = false;
    updateAutoPlayButton();
    update();
  });

  const btnPlay = document.getElementById("btn-play");
  function updateAutoPlayButton() {
    if (autoPlay) {
      btnPlay.textContent = I18N[lang].btnStop;
      btnPlay.classList.add("active");
    } else {
      btnPlay.textContent = I18N[lang].btnPlay;
      btnPlay.classList.remove("active");
    }
  }

  function updateColorsButton() {
    if (colorsOn) {
      btnColors.textContent = I18N[lang].btnColorsOn;
      btnColors.classList.add("active");
      hourColorsG.classList.add("on");
      hourSectorsG.classList.add("on");
    } else {
      btnColors.textContent = I18N[lang].btnColorsOff;
      btnColors.classList.remove("active");
      hourColorsG.classList.remove("on");
      hourSectorsG.classList.remove("on");
    }
  }

  function applyLang() {
    document.documentElement.setAttribute("lang", lang);
    document.title = I18N[lang].title;
    btnLang.textContent = I18N[lang].btnLangOther;
    btnNow.textContent = I18N[lang].btnNow;
    hintEl.textContent = I18N[lang].hint;
    updateAutoPlayButton();
    updateColorsButton();
  }

  btnLang.addEventListener("click", function() {
    lang = (lang === "ko") ? "en" : "ko";
    applyLang();
    update();
  });

  btnColors.addEventListener("click", function() {
    colorsOn = !colorsOn;
    updateColorsButton();
  });

  btnMenu.addEventListener("click", function() {
    menuOpen = !menuOpen;
    if (menuOpen) {
      controlsEl.classList.add("open");
      btnMenu.textContent = "✕";
    } else {
      controlsEl.classList.remove("open");
      btnMenu.textContent = "☰";
    }
  });
  btnPlay.addEventListener("click", function() {
    autoPlay = !autoPlay;
    if (autoPlay) {
      autoPlayStart = performance.now();
      autoPlayStartMinutes = totalMinutes;
    }
    updateAutoPlayButton();
  });

  // Animation loop (for auto play)
  function tick(now) {
    if (autoPlay && !dragging) {
      // Full day in 60 seconds
      const elapsedSec = (now - autoPlayStart) / 1000;
      totalMinutes = autoPlayStartMinutes + elapsedSec * (1440 / 60);
      update();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener("resize", update);

  applyLang();
  update();
  requestAnimationFrame(tick);

  // Hide the drag hint 10 seconds after page load
  setTimeout(function() {
    hintEl.classList.add("hidden");
  }, 10000);
})();
</script>
</body>
</html>
